services:
  geotandem:
    build: .
    init: true
    ports:
      - '${HOST_PORT:-3039}:3039'
    environment:
      NODE_ENV: production
      PORT: 3039
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    stop_grace_period: 10s
